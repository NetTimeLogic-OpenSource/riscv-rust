profile = "dist"
change-id = 99999999

# Targets are passed on the x dist command line (host + riscv32imac)

[dist]
compression-formats = ["gz"]

[rust]
channel = "stable"

[llvm]
download-ci-llvm = true

[target.riscv32imac-unknown-linux-gnu]
cc = "clang"
cxx = "clang++"
linker = "clang"
ar = "llvm-ar"
